# hype-checker 보류 검증셋 v1 (텍스트 입력 식별)
#
# 2026-10-24 작성, **첫 실행 전에 커밋해 고정**한다. 실행 결과를 보고 이 파일을 고치지 않는다.
# 출처: research log.md·requests/hype-checker-feasibility.md 카드가 gh api로 실측해 인용한 레포 37개.
#       2026-10-24 gh api로 존재·정본 이름 재확인. 정답셋(goldset.yaml)과 설계·보정에 쓴 레포
#       (Ruflo·REA·kordoc·im-not-ai·OmniRoute·LiteLLM·GENEXIS·Starguard·deps.dev·MCP registry 등)는 뺐다.
# 입력: 고정 템플릿 하나에 레포 이름만 끼운 캡션(작성자 편향 방지). 대조군 4건은 도구가 없는 캡션.
# 한계: 실제 게시물이 아니라 합성 캡션이라 추출 난도는 실제보다 낮다. 식별(동명 레포 구분)이 주 측정 대상.
# 채점: goldset과 같은 scoring.py. 그룹 V-text는 식별(고정 분모)이 주 지표, V-control은 정밀도.

