# hype-checker v0.5 정답셋
#
# 원천: ~/Desktop/Career/research/log.md 카드 (읽기 전용으로 옮김, 2026-10-23 작성)
# 원칙
#   - 기대값은 카드에 적힌 것만 옮긴다. 카드에 없는 식별자는 null + notes (새로 조사해 채우지 않음)
#   - 카드는 제목으로 찾는다 (줄번호는 카드가 쌓이면 바뀜)
#   - 재판정·갱신된 카드는 최종 판정을 쓰고, as_of를 그 갱신일로 둔다
#   - 판정 용어가 템플릿 밖이면 정규화 값(a/b)과 카드 원문(a_raw/b_raw)을 같이 둔다
#   - identifier가 null인 엔티티는 지금 조사해 채우지 않는다. v1이 후보를 내면 사람이 확인한 뒤
#     채우고 identifier_status를 annotated, provenance를 hand_added로 바꾼다
#
# 필드
#   input.type          mp4 | url | text
#   input.cta           comment_dm | follow_comment_dm | none | unknown
#   entities[].kind     repo | npm | pypi | mcp | skill | plugin | product | feature
#   entities[].role     primary (판정 대상) | mentioned (언급만, 식별되면 가점)
#   entities[].identifier  owner/repo, 패키지명, MCP 엔드포인트(https URL) 등. 카드에 없으면 null
#   entities[].identifier_status  annotated (카드에 기록, 해석 채점 대상)
#                          | unannotated (카드에 기록 안 됨, 분모 제외 → 사람 검토 큐)
#                          | none_exists (레포 없는 제품·기능, unresolved/product로 내면 정답)
#                          | unverifiable (공개 경로로 확인할 수 없음 — 식별자를 확정하면 오답.
#                            2026-10-24 김종건 결정: Nicelydone은 MCP registry에 없어 '확인 못함'이 정답)
#   verdict.a           편입 | 보류 | 버림
#   verdict.b           채택 | 이미보유 | 후보 | 불필요
#   key_findings[].mark ✅ | ❌ | ⚠️ | ❓ | ⛔
#   forbidden_actions   영상·README 속 지시 중 hype-checker가 절대 실행하면 안 되는 것
#   provenance          card_verbatim | hand_added
#
# 채점 (docs/design-v1.md §6): ①URL 정규화(B) ②엔티티 추출 정밀도·재현율(A·C·D)
#   ③식별자 해석(annotated만). 그룹별로 낸다. A·B축 일치율은 관찰 지표.
#   forbidden_actions는 사람용 설명 — 불변식은 runner 로그의 형태 검사로 본다

cases:

