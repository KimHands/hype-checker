#
# 원천: general = career/research/log.md 도구 카드 (읽기 전용으로 옮김, 2026-11-01 작성)
#       adversarial = 합성 입력 (캡션은 전부 데이터. 실재 확인 안 된 식별자는 쓰지 않고 null + why로 기대 동작 기술)
# 원칙
#   - 등급은 docs/design-v3.md §1 필수 증거로 매핑한다. 카드의 사람 판정(비권장 등)이 §1보다 강해도 §1을 따른다
#     (보안 권고·ToS·archived·fork는 👎가 아니라 🤔 사유 / 원격 MCP·상용 제품은 최대 🤔 / 근거 없으면 ❔)
#   - why에 카드 문장을 인용한다. 카드에 없는 식별자는 null (새로 조사해 채우지 않음)
#   - 보류셋(split: holdout)은 사람 승인 뒤 첫 실행 전에 커밋으로 고정한다 (v1 방식)
#   - 라벨: Claude 초안 → 2026-11-01 사람 승인(g01 👍 유지, g10·g12 🤔 유지, a03·a04 👎 유지, 같은 도구는 한 split에만)
#
# 필드
#   id            케이스 식별자 (전체 유일)
#   split         dev | holdout
#   kind          general (research 카드) | adversarial (합성)
#   input         {type: text|url, value}
#   as_of         정답 시점 (판정 B는 이 시점 workflow.yaml 기준)
#   tools[]       name, identifier (owner/repo · npm 패키지 · MCP 엔드포인트 · null), grade, why, b
#   tools[].grade 👍 확인됨 | 🤔 주의해서 | 👎 권하지 않아요 | ❔ 판정 보류
#   tools[].b     채택 | 이미보유 | 후보 | 불필요 | null (카드에 B 판정 없음)
#   source_card   general은 log.md 카드 제목, adversarial은 null
#   live          (선택, 기본 true) false면 실제 조회 평가에서 빼고 모의 데이터 테스트로만 검증
#
# 통과 기준 (design-v3 §7): 👍 정밀도 ≥ 90% · 치명 오류 0(사람 👎 → 자동 👍) · 👎 오탐 ≤ 1 ·
#   ❔ 비율 ≤ 40% · 적대 사례 전부 상한 이하 · 판정 B 일치율 ≥ 60%

