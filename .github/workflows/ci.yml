name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'KimHands/hype-checker'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HC_WATCH_SCRIPT: ${{ github.workspace }}/.ci/watch/skills/watch/scripts/watch.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out watch 0.3.2 (preflight reads its config parser)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bradautomates/claude-video
          ref: 03ceb42f7fa2c4439aca01752118044baabffb8f  # v0.3.2
          path: .ci/watch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
